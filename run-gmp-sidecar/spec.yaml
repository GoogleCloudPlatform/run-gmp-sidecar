name: run-gmp-sidecar
module: github.com/GoogleCloudPlatform/run-gmp-sidecar/run-gmp
display_name: Cloud Run GMP Sidecar
description: The Cloud Run GMP Sidecar build of the OTel Collector
blurb: The run-gmp-sidecar is Google's recommended, serverless-friendly solution for seamlessly integrating Google Managed Service for Prometheus (GMP) into Cloud Run services. Leveraging Cloud Run's multi-container capabilities, it deploys a specialized OpenTelemetry Collector as a secondary "sidecar" container running directly alongside your main application.
build_container: debian
version: 1.9.0
opentelemetry_version: 0.155.0
opentelemetry_contrib_version: 0.155.0
opentelemetry_stable_version: 1.61.0
go_version: 1.26.4
binary_name: rungmpcol
build_tags: ""
boringcrypto: false
docker_repo: ""
components:
    receivers:
        - otlp
        - prometheus
    processors:
        - filter
        - groupbyattrs
        - metricstransform
        - resourcedetection
        - resource
        - transform
        - batch
        - memorylimiter
    exporters:
        - debug
        - nop
        - otlp
        - otlphttp
        - file
        - googlecloud
        - googlemanagedprometheus
    extensions:
        - zpages
    providers:
        - env
        - file
        - yaml
replaces:
    - from: github.com/mattn/go-ieproxy v0.0.9
      to: github.com/mattn/go-ieproxy v0.0.1
      reason: Currently causes build issues on windows. Downgrading to previous version.
    - from: github.com/prometheus/prometheus
      to: github.com/avilevy18/prometheus v0.0.0-20260617191927-29f66dde2eef
      reason: 'Point to our fork of Prometheus at branch: feature/shutdownscrape'
component_module_base: ""
distrogen_version: ""
